<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
    <!-- Outer Blueprint Grid -->
    <rect x="12" y="12" width="76" height="76" rx="4" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3" opacity="0.4" />
    <!-- Main Square Bar Face -->
    <rect x="20" y="20" width="60" height="60" rx="3" fill="url(#metalGradSquare)" stroke="#60a5fa" stroke-width="3" />
    <!-- Diagonal Construction Lines -->
    <line x1="20" y1="20" x2="80" y2="80" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
    <line x1="20" y1="80" x2="80" y2="20" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.6" />
    <circle cx="50" cy="50" r="3.5" fill="#38bdf8" />
    <!-- Dimension Marker -->
    <line x1="14" y1="20" x2="14" y2="80" stroke="#f59e0b" stroke-width="2" />
    <line x1="10" y1="20" x2="18" y2="20" stroke="#f59e0b" stroke-width="2" />
    <line x1="10" y1="80" x2="18" y2="80" stroke="#f59e0b" stroke-width="2" />
    <defs>
        <radialGradient id="metalGradSquare" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="50%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </radialGradient>
    </defs>
</svg>
