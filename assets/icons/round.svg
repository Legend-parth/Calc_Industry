<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
    <!-- Outer Blueprint Grid -->
    <circle cx="50" cy="50" r="42" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3" opacity="0.4" />
    <!-- Main Cylindrical Rod Face -->
    <circle cx="50" cy="50" r="34" fill="url(#metalGradRound)" stroke="#60a5fa" stroke-width="3" />
    <!-- Center Point & Crosshairs -->
    <line x1="16" y1="50" x2="84" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7" />
    <line x1="50" y1="16" x2="50" y2="84" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 2" opacity="0.7" />
    <circle cx="50" cy="50" r="3.5" fill="#38bdf8" />
    <!-- Diameter Dimension Arrow -->
    <path d="M 28 35 L 72 65" stroke="#f59e0b" stroke-width="2" />
    <circle cx="28" cy="35" r="2.5" fill="#f59e0b" />
    <circle cx="72" cy="65" r="2.5" fill="#f59e0b" />
    <defs>
        <radialGradient id="metalGradRound" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="50%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </radialGradient>
    </defs>
</svg>
