<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" fill="none">
    <!-- Outer Blueprint Hexagon -->
    <polygon points="50,8 86,28 86,72 50,92 14,72 14,28" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4 3" opacity="0.4" />
    <!-- Main Hexagon Bar Face -->
    <polygon points="50,15 82,33 82,67 50,85 18,67 18,33" fill="url(#metalGradHex)" stroke="#60a5fa" stroke-width="3" />
    <!-- Across Flats Measurement -->
    <line x1="18" y1="50" x2="82" y2="50" stroke="#f59e0b" stroke-width="2" />
    <circle cx="18" cy="50" r="2.5" fill="#f59e0b" />
    <circle cx="82" cy="50" r="2.5" fill="#f59e0b" />
    <circle cx="50" cy="50" r="3.5" fill="#38bdf8" />
    <defs>
        <radialGradient id="metalGradHex" cx="40%" cy="40%" r="60%">
            <stop offset="0%" stop-color="#334155" />
            <stop offset="50%" stop-color="#1e293b" />
            <stop offset="100%" stop-color="#0f172a" />
        </radialGradient>
    </defs>
</svg>
